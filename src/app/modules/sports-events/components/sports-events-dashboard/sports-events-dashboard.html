<section class="sports-section">

  <div class="section-header">
    <div class="section-header__text">
      <div class="section-badge">
        <mat-icon>sports</mat-icon>
        <span>Deportes disponibles</span>
      </div>
      <h2 class="section-title">¿Qué quieres practicar?</h2>
    </div>

    <button
      *appRequirePermission="Permission.CreateSports"
      mat-stroked-button
      class="add-sport-btn"
      (click)="openCreateSportDialog()"
    >
      <mat-icon>add</mat-icon>
      <span>Añadir deporte</span>
    </button>
  </div>

  <div class="sports-grid">
    @for (sport of vm.sports(); track sport.id; let i = $index) {
      <div
        class="sport-card sport-card--c{{ i % 6 }}"
        (click)="goToSport(sport)"
        [attr.aria-label]="'Ver eventos de ' + sport.name"
        role="button"
        tabindex="0"
        (keydown.enter)="goToSport(sport)"
      >
        <div class="sport-card__glow"></div>
        <div class="sport-card__icon-wrapper">
          <span class="sport-card__initial">{{ sport.name.charAt(0).toUpperCase() }}</span>
        </div>
        <div class="sport-card__content">
          <h3 class="sport-card__name">{{ sport.name }}</h3>
          <span class="sport-card__cta">
            Ver eventos
            <mat-icon class="sport-card__arrow">arrow_forward</mat-icon>
          </span>
        </div>
      </div>
    }

    @empty {
      <div class="sports-empty">
        <mat-icon>sports_tennis</mat-icon>
        <span>No hay deportes disponibles</span>
      </div>
    }
  </div>

</section>
