<div class="table-wrapper">
  <table
    class="events-table"
    *appResponsiveDisplay="ResponsiveDisplayMode.Desktop"
    mat-table
    matSort
    appPaginationTableSort
    [dataSource]="sportsEvents()"
    [pagination]="pagination()"
  >
  
    <!-- Nombre -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        Evento
      </th>
  
      <td mat-cell *matCellDef="let event">
        <div class="event-name">
          {{ event.name }}
        </div>
      </td>
    </ng-container>
  
    <!-- Localización -->
    <ng-container matColumnDef="location">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        Ubicación
      </th>
  
      <td mat-cell *matCellDef="let event">
        <div class="location">
          <mat-icon>location_on</mat-icon>
          {{ event.location }}
        </div>
      </td>
    </ng-container>
  
    <!-- Fecha -->
    <ng-container matColumnDef="eventDate">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        Fecha
      </th>
  
     <td mat-cell *matCellDef="let event">
    <div class="event-cell">
  
      <div class="event-avatar">
        <mat-icon>date_range</mat-icon>
      </div>
  
      <div class="event-info">
        <div class="event-name">
          {{ event.eventDate | date }}
        </div>
      </div>
  
    </div>
  </td>
    </ng-container>
  
    <!-- Jugadores -->
    <ng-container matColumnDef="players">
      <th mat-header-cell *matHeaderCellDef>
        Jugadores
      </th>
  
      <td mat-cell *matCellDef="let event">
        <div class="players-chip">
          <mat-icon>groups</mat-icon>
          {{ event.minPlayers }} - {{ event.maxPlayers }}
        </div>
      </td>
    </ng-container>
  
    <ng-container matColumnDef="status">
  
    <th mat-header-cell *matHeaderCellDef>
      Estado
    </th>
  
    <td mat-cell *matCellDef="let event">
  
  
  
    </td>
  
  </ng-container>
  <ng-container matColumnDef="actions">
  
    <th mat-header-cell *matHeaderCellDef></th>
  
    <td mat-cell *matCellDef="let event">
  
      <button
        mat-icon-button
        [matMenuTriggerFor]="menu"
      >
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #menu="matMenu">
  
        <button mat-menu-item>
          <mat-icon>visibility</mat-icon>
          Ver evento
        </button>
  
        <button mat-menu-item>
          <mat-icon>edit</mat-icon>
          Editar
        </button>
  
        <button mat-menu-item>
          <mat-icon>delete</mat-icon>
          Eliminar
        </button>
  
      </mat-menu>
  
    </td>
  
  </ng-container>
  
    <!-- Header & Rows -->
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns" class="event-row"></tr>
  
  </table>

</div>
