<header>
  <h2><strong>{{ vm.sports().name }}</strong></h2>
  <div class="actions">
    <div class="search-box">
      <mat-icon>search</mat-icon>
      <input
        appSearch
        [delay]="400"
        (search)="onSearchByName($event)"
        [value]="initialNameFilter"
        placeholder="Buscar por nombre..."
        type="text"
      />
    </div>
    <a mat-raised-button (click)="create()">
      <mat-icon>add</mat-icon>
      <span>Nuevo Evento</span>
    </a>
  </div>
</header>

@if (vm.sportEvents(); as sportsEvents) {
  @if (hasBothEventTypes()) {
    <mat-tab-group class="events-tabs" animationDuration="0ms" mat-stretch-tabs="true">
      <mat-tab label="Próximos eventos">
        <app-sports-events-overview-items
          [sportsEvents]="upcomingEvents()"
          [isSendingRequest]="vm.isSendingRequest()"
          [pagination]="vm.pagination"
          [loading]="loading()"
          emptyMessage="No hay eventos próximos"
          (joined)="refresh()"
        ></app-sports-events-overview-items>
      </mat-tab>
      <mat-tab label="Eventos pasados">
        <app-sports-events-overview-items
          [sportsEvents]="pastEvents()"
          [isSendingRequest]="vm.isSendingRequest()"
          [pagination]="vm.pagination"
          [loading]="loading()"
          emptyMessage="No hay eventos pasados"
          (joined)="refresh()"
        ></app-sports-events-overview-items>
      </mat-tab>
    </mat-tab-group>
  } @else {
    <app-sports-events-overview-items
      [sportsEvents]="singleListEvents()"
      [isSendingRequest]="vm.isSendingRequest()"
      [pagination]="vm.pagination"
      [loading]="loading()"
      emptyMessage="No hay eventos para este deporte"
      (joined)="refresh()"
    ></app-sports-events-overview-items>
  }

  @if (sportsEvents.meta.total > vm.pagination.value.size) {
    <mat-paginator
      class="dark-paginator"
      [length]="sportsEvents.meta.total"
      [pageIndex]="vm.pagination.value.page - 1"
      [pageSize]="vm.pagination.value.size"
      [pageSizeOptions]="[10, 25, 50]"
      (page)="onPageChange($event)"
    ></mat-paginator>
  }
}
