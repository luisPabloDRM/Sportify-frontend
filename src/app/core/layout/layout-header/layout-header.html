<header class="header">
  <div class="container">

    <!-- Logo -->
    <a class="logo" routerLink="/dashboard" aria-label="Ir al inicio">
      <mat-icon class="logo__icon">sports</mat-icon>
      <span class="logo__text">Jugatta</span>
    </a>

    <!-- Nav principal -->
    <nav class="nav" [class.open]="isMenuOpen" (click)="closeMenu()">
      @if (isAdmin) {
        <a class="nav__link"
           routerLink="/dashboard/users/list"
           routerLinkActive="nav__link--active">
          Usuarios
        </a>
      } @else {
        <a class="nav__link"
           routerLink="/dashboard/users/profile"
           routerLinkActive="nav__link--active">
          Mi perfil
        </a>
      }
    </nav>

    <!-- Acciones derecha -->
    <div class="header-right">

      <!-- Campana de notificaciones -->
      @if (user) {
        <button class="notif-btn" [matMenuTriggerFor]="notifMenu" (menuOpened)="onNotifMenuOpened()" aria-label="Notificaciones">
          <mat-icon [matBadge]="unreadCount() || null" matBadgeColor="warn" matBadgeSize="small">notifications</mat-icon>
        </button>

        <mat-menu #notifMenu="matMenu" xPosition="before" class="notif-menu">
          <div class="notif-menu-header" (click)="$event.stopPropagation()">
            <span>Notificaciones</span>
            <button mat-button (click)="markAllAsRead($event)" [disabled]="unreadCount() === 0">
              Marcar todas como leídas
            </button>
          </div>
          <mat-divider></mat-divider>
          @if (notifications().length === 0) {
            <div class="notif-empty">No tienes notificaciones</div>
          } @else {
            @for (notification of notifications(); track notification.id) {
              <button
                mat-menu-item
                class="notif-item"
                [class.unread]="!notification.read"
                (click)="onNotificationClick(notification)"
              >
                <mat-icon>{{ iconFor(notification.type) }}</mat-icon>
                <span class="notif-item__text">{{ notification.message }}</span>
                <span class="notif-item__time">{{ relativeTime(notification.createdAt) }}</span>
              </button>
            }
          }
        </mat-menu>
      }

      <!-- Avatar / menú usuario -->
      @if (user) {
        <button class="user-btn" [matMenuTriggerFor]="userMenu" aria-label="Menú de usuario">
          <span class="user-btn__avatar">{{ initials }}</span>
          <span class="user-btn__name">{{ user.fullname }}</span>
          <mat-icon class="user-btn__chevron">expand_more</mat-icon>
        </button>

        <mat-menu #userMenu="matMenu" xPosition="before">
          <div class="user-menu-info" mat-menu-item disabled>
            <div class="user-menu-info__name">{{ user.fullname }}</div>
            <div class="user-menu-info__email">{{ user.email }}</div>
          </div>
          <mat-divider></mat-divider>
          <button mat-menu-item routerLink="/dashboard/users/profile">
            <mat-icon>person</mat-icon>
            <span>Mi perfil</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="logOut()" class="logout-item">
            <mat-icon>logout</mat-icon>
            <span>Cerrar sesión</span>
          </button>
        </mat-menu>
      }

      <!-- Hamburguesa (móvil) -->
      <button class="menu-toggle" (click)="$event.stopPropagation(); toggleMenu()" aria-label="Abrir menú">
        <mat-icon>{{ isMenuOpen ? 'close' : 'menu' }}</mat-icon>
      </button>

    </div>

  </div>
</header>
